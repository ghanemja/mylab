name: CI

# Runs on every push and pull request. The same checks run locally with scripts/check.sh.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.16.9"
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,vision]"
      - run: python -m pytest -q -p no:cacheprovider
      # The function reference the VS Code extension bundles is generated from mylab's help entries.
      # (The browser app needs no such file: it reads the list from the engine when it starts.)
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python scripts/gen_editor_data.py --check

  dependencies:
    name: test (${{ matrix.name }} NumPy, SciPy, Matplotlib)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest
            python-version: "3.10"
            pins: "numpy==1.26.* scipy==1.13.* matplotlib==3.8.* pillow==10.* h5py==3.15.1"
          - name: newest
            python-version: "3.14"
            pins: "--upgrade numpy scipy matplotlib pillow h5py"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ${{ matrix.pins }} pytest
      - run: pip install -e .
      - run: python -c "import numpy, scipy, matplotlib, h5py; print(numpy.__version__, scipy.__version__, matplotlib.__version__, h5py.__version__)"
      - run: python -m pytest -q -p no:cacheprovider

  probes:
    name: MATLAB-behaviour checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[excel,symbolic,fast]"
      - name: Original checks (no check that passed before may fail now)
        run: python tests/probes/check_expected.py --set original --jobs 4
      - name: Held-out checks
        run: python tests/probes/check_expected.py --set heldout --jobs 4

  tasks:
    name: MATLAB Tasks benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - working-directory: datasets/matlab-tasks
        run: python tools/run_tasks.py --show-failures

  speed:
    name: speed (fails on a slowdown of more than 25%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[fast]"
      - run: python benchmarks/speed_check.py --limit 0.25

  web:
    # The same checks in the engines of Chrome/Edge, Firefox and Safari. The Chromium job keeps its old name.
    name: browser app${{ matrix.browser != 'chromium' && format(' ({0})', matrix.browser) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a run takes 6-11 minutes; a hang should fail with its log, not wait 6 hours
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install build setuptools wheel
      # one check compares the editor's list of functions with the engine's own
      - run: pip install -e .
      - run: npm install --no-save playwright@1.63.0 axe-core@4.14.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # every CDN file still matches its integrity hash, and the bundled packages (web/vendor/) match a fresh build
      - if: matrix.browser == 'chromium'
        run: python scripts/sri.py --check
      - if: matrix.browser == 'chromium'
        run: node scripts/vendor.mjs --check
      - run: node scripts/test_web.mjs --no-screenshot --browser ${{ matrix.browser }}
