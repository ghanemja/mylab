[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mylab"
version = "0.1.0"
description = "A free, open-source environment for running MATLAB-language code, built on NumPy, SciPy and Matplotlib."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mylab contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]
keywords = ["matlab", "octave", "numerical computing", "education", "interpreter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
mylab = "mylab.cli:main"

[tool.setuptools.packages.find]
include = ["mylab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B023", "E741", "B905", "B904"]
