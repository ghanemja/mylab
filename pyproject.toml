[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mylab-lang"
version = "1.0.0"
description = "A free, open-source environment for running MATLAB-language code, built on NumPy, SciPy and Matplotlib."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mylab contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=9",
]
keywords = ["matlab", "octave", "numerical computing", "education", "interpreter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/ghanemja/mylab"
Documentation = "https://github.com/ghanemja/mylab/tree/main/docs"
Issues = "https://github.com/ghanemja/mylab/issues"
Changelog = "https://github.com/ghanemja/mylab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
jupyter = ["ipykernel>=6"]
fast = ["numexpr>=2.8"]
dev = ["pytest>=7", "ruff>=0.4", "mcp>=1.2", "ipykernel>=6", "jupyter_client>=8", "numexpr>=2.8"]

[project.scripts]
mylab = "mylab.cli:main"
mylab-mcp = "mylab.mcp_server:main"
mylab-kernel = "mylab.kernel:main"
mylab-grade = "mylab.grader:main"

[tool.setuptools.packages.find]
include = ["mylab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".claude", "web"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B023", "E741", "B905", "B904"]
